<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1080px; overflow: hidden; position: relative;
    background-color: #111;
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .bg-image {
    position: absolute; top: 0; left: 0; width: 1080px; height: 1080px;
    object-fit: cover; z-index: 1; filter: brightness(0.96) contrast(1.02);
  }
  .lighting-overlay {
    position: absolute; top: 0; left: 0; width: 1080px; height: 1080px;
    background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.15) 100%),
                linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, transparent 35%, transparent 65%, rgba(0,0,0,0.35) 100%);
    z-index: 2; pointer-events: none;
  }
  .product-wrapper {
    position: absolute; z-index: 3; pointer-events: none;
    display: flex; justify-content: center; align-items: center;
  }
  .product-img {
    width: 100%; height: auto; display: block;
    filter: drop-shadow(0 32px 45px rgba(0,0,0,0.7)) drop-shadow(0 10px 18px rgba(0,0,0,0.45));
  }
  .deal-header {
    position: absolute; top: 55px; left: 60px; z-index: 10;
    display: flex; flex-direction: column; align-items: flex-start;
  }
  .badge-limited {
    background-color: #C8102E; color: #FFFFFF;
    font-size: 38px; font-weight: 900; letter-spacing: 0.5px;
    text-transform: uppercase; padding: 13px 26px; display: inline-block;
    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
  }
  .price-was {
    color: #C8102E; font-size: 38px; font-weight: 800;
    margin-top: 14px; margin-left: 2px;
    text-decoration: line-through; text-decoration-color: #C8102E; text-decoration-thickness: 3.5px;
    letter-spacing: 0.5px; text-shadow: 0 1px 3px rgba(255,255,255,0.9);
  }
  .price-now-box {
    background-color: #FFFFFF; color: #C8102E;
    font-size: 64px; font-weight: 900; letter-spacing: -0.5px;
    padding: 13px 28px; margin-top: 12px; display: inline-block;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
  }
  .save-circle-badge {
    position: absolute; z-index: 10;
    width: 170px; height: 170px; background-color: #C8102E; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.35); text-align: center;
  }
  .save-circle-badge .save-title {
    color: #FFFFFF; font-size: 28px; font-weight: 800; letter-spacing: 1px; line-height: 1.1;
  }
  .save-circle-badge .save-val {
    color: #FFFFFF; font-size: 38px; font-weight: 900; line-height: 1.1; margin-top: 2px;
  }
  .logo-bottom-right {
    position: absolute; bottom: 50px; right: 60px; z-index: 10;
    width: 290px; filter: drop-shadow(0 3px 10px rgba(0,0,0,0.55));
  }
  .logo-bottom-right img { width: 100%; height: auto; display: block; }
</style>
</head>
